name: Slack Release Notification

on:
  release:
    types: [published]

jobs:
  notify-slack:
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack release-published notification
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEPLOY_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_DEPLOY_URL is not configured."
            exit 0
          fi

          message=$(printf ':white_check_mark: *Desktop released*\nVersion: `%s`\n<%s|Open release>' \
            "$RELEASE_TAG" \
            "$RELEASE_URL")

          export SLACK_MESSAGE="$message"
          payload=$(python3 -c '
          import json
          import os

          print(json.dumps({
              "text": os.environ["SLACK_MESSAGE"],
              "blocks": [
                  {
                      "type": "card",
                      "title": {
                          "type": "mrkdwn",
                          "text": ":white_check_mark: Desktop released",
                          "verbatim": False
                      },
                      "subtitle": {
                          "type": "mrkdwn",
                          "text": os.environ["RELEASE_TAG"] + " · production",
                          "verbatim": False
                      },
                      "body": {
                          "type": "mrkdwn",
                          "text": "<" + os.environ["RELEASE_URL"] + "|Open release>",
                          "verbatim": False
                      }
                  },
                  {
                      "type": "context",
                      "elements": [
                          {
                              "type": "mrkdwn",
                              "text": "GitHub Actions"
                          }
                      ]
                  }
              ]
          }))
          ')

          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL"
